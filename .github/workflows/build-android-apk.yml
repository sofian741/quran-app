name: Build Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'tests/**'
      - 'artifacts/**'
      - 'RELEASE_AUDIT/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK 36
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install Capacitor dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare bundled web app
        run: npm run android:prepare

      - name: Create Android project
        run: npx cap add android

      - name: Sync web app
        run: npx cap sync android

      - name: Reconstruct approved app icon
        run: |
          cat android-assets/icon-b64/*.part | base64 -d > android-assets/icon-source.jpg
          echo "ac53289fe8888727ec5e26700ed89e497ff0e80224b6489ac4c293f5354adcb7  android-assets/icon-source.jpg" | sha256sum -c -
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          p = Image.open('android-assets/icon-source.jpg').convert('RGB')
          p = p.resize((1024, 1024), Image.Resampling.LANCZOS)
          p.save('android-assets/icon.png', optimize=True)
          PY

      - name: Generate Android icon and splash
        run: |
          npx @capacitor/assets generate --android \
            --assetPath android-assets \
            --iconBackgroundColor '#015e46' \
            --iconBackgroundColorDark '#015e46' \
            --splashBackgroundColor '#131d19' \
            --splashBackgroundColorDark '#131d19'

      - name: Apply Android app label and vibration permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text(encoding='utf-8')
          permission = '<uses-permission android:name="android.permission.VIBRATE" />'
          if permission not in text:
              text = text.replace('<application', permission + '\n    <application', 1)
              manifest.write_text(text, encoding='utf-8')

          strings = Path('android/app/src/main/res/values/strings.xml')
          text = strings.read_text(encoding='utf-8')
          text = re.sub(r'<string name="app_name">.*?</string>', '<string name="app_name">نور القرآن</string>', text)
          text = re.sub(r'<string name="title_activity_main">.*?</string>', '<string name="title_activity_main">نور القرآن</string>', text)
          strings.write_text(text, encoding='utf-8')
          PY

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK artifact
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/Noor-Al-Quran-debug.apk"
          sha256sum "dist/Noor-Al-Quran-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Noor-Al-Quran-APK
          path: dist/Noor-Al-Quran-debug.apk
          if-no-files-found: error
          retention-days: 14
