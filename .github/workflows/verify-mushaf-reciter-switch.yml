name: Verify mushaf reciter grouping and verse fallback
on:
  push:
    branches: [main]
    paths:
      - mushaf-audio.js
      - quran.html
      - audio-player.css
      - tests/mushaf-reciter-switch.cjs
      - tests/qud-play-browser.cjs
      - qud-audio.js
      - .github/workflows/verify-mushaf-reciter-switch.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install browser test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq chromium
          npm install --no-save --no-package-lock playwright@1.56.1
      - name: Start local mushaf
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/quran-test-server.log 2>&1 &
          sleep 2
      - name: Test full library and automatic reciter fallback
        env:
          QURAN_BROWSER_PATH: /usr/bin/chromium
          QURAN_BASE_URL: http://127.0.0.1:4173
        run: |
          node --check mushaf-audio.js
          node --check tests/mushaf-reciter-switch.cjs
          node --check tests/qud-play-browser.cjs
          node tests/mushaf-reciter-switch.cjs

      - name: Verify QUD 9000 playback in Chromium
        env:
          QURAN_BROWSER_PATH: /usr/bin/chromium
          QURAN_BASE_URL: http://127.0.0.1:4173
          QUD_RECITER_ID: '9000'
        run: node tests/qud-play-browser.cjs
      - name: Verify QUD 9001 playback in Chromium
        env:
          QURAN_BROWSER_PATH: /usr/bin/chromium
          QURAN_BASE_URL: http://127.0.0.1:4173
          QUD_RECITER_ID: '9001'
        run: node tests/qud-play-browser.cjs
      - name: Verify QUD 9016 playback in Chromium
        env:
          QURAN_BROWSER_PATH: /usr/bin/chromium
          QURAN_BASE_URL: http://127.0.0.1:4173
          QUD_RECITER_ID: '9016'
        run: node tests/qud-play-browser.cjs
      - name: Verify QUD 9017 playback in Chromium
        env:
          QURAN_BROWSER_PATH: /usr/bin/chromium
          QURAN_BASE_URL: http://127.0.0.1:4173
          QUD_RECITER_ID: '9017'
        run: node tests/qud-play-browser.cjs
      - name: Compare real Maher and Hani audio hosts
        if: always()
        shell: bash
        run: |
          set +e
          for entry in \
            'Maher|https://download.quranicaudio.com/quran/maher_almu3aiqly/year1440/001.mp3' \
            'Hani|https://verses.quran.com/Hani_Ar_Rifai/mp3/001.mp3'; do
            name="${entry%%|*}"
            url="${entry#*|}"
            echo "===== ${name} actual audio host ====="
            curl -IL --max-time 18 --connect-timeout 7 -H 'Range: bytes=0-1023' -sS -o /dev/null -w 'http=%{http_code} final=%{url_effective} type=%{content_type} bytes=%{size_download} error=%{errormsg}\n' "$url"
          done
