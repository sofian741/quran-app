name: Audit additional synchronized reciters
on:
  push:
    branches: [main]
    paths: [.github/workflows/audit-extra-audio.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify every verse and word timing for candidate readers
        run: |
          python3 - <<'PY'
          import sys, time
          sys.path.insert(0,'scripts')
          import sync_qud_audio as base
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from urllib.error import HTTPError
          ids={3:'عبد الرحمن السديس',5:'هاني الرفاعي',10:'سعود الشريم'}
          def check_one(item):
              rid,surah=item
              url=f'https://api.quran.com/api/v4/chapter_recitations/{rid}/{surah}?segments=true'
              for retry in range(3):
                  try:
                      data=base.request_json(url)
                      f=data.get('audio_file') or {}
                      ts=f.get('timestamps') or []
                      count=base.VERSE_COUNTS[surah-1]
                      bad=[]
                      if len(ts)!=count: bad.append('verse_count:'+str(len(ts)))
                      if not base.safe_https_audio_url(f.get('audio_url')): bad.append('audio_url')
                      for ayah,t in enumerate(ts,1):
                          if t.get('verse_key')!=f'{surah}:{ayah}': bad.append('verse_order:'+str(ayah))
                          if not isinstance(t.get('timestamp_from'),int) or not isinstance(t.get('timestamp_to'),int) or t['timestamp_to']<=t['timestamp_from']: bad.append('verse_time:'+str(ayah))
                          seg=t.get('segments') or []
                          usable=[x for x in seg if isinstance(x,list) and len(x)==3 and isinstance(x[0],int) and x[0]>0 and all(isinstance(v,(int,float)) for v in x[1:]) and x[2]>x[1]>=0]
                          if not usable: bad.append('no_usable_segments:'+str(ayah)+':'+repr(seg[:2]))
                      return rid,surah,len(ts),len(bad),bad[:3]
                  except HTTPError as e:
                      if e.code in (429,500,502,503,504) and retry<2: time.sleep(1+retry*2); continue
                      return rid,surah,0,1,[str(e)]
                  except Exception as e:
                      if retry<2: time.sleep(1+retry*2);continue
                      return rid,surah,0,1,[repr(e)]
          tasks=[(rid,surah) for rid in ids for surah in range(1,115)]
          results=[]
          with ThreadPoolExecutor(max_workers=5) as pool:
              futures=[pool.submit(check_one,t) for t in tasks]
              for f in as_completed(futures): results.append(f.result())
          for rid,name in ids.items():
              rs=[x for x in results if x[0]==rid]
              bad=[x for x in rs if x[3]]
              print('FULL_RESULT',rid,name,'valid_chapters',len(rs)-len(bad),'of',len(rs),'verses',sum(x[2] for x in rs),'bad',bad[:12],flush=True)
          sample=base.request_json('https://api.quran.com/api/v4/chapter_recitations/3/1?segments=true')['audio_file']['timestamps']
          print('SAMPLE_SEGMENTS',[(x['verse_key'],x['timestamp_from'],x['timestamp_to'],x.get('segments',[])[:4]) for x in sample[:3]])
          PY
