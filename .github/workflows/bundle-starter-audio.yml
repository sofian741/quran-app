name: Bundle CC0 offline Al-Fatiha
on:
  push:
    paths:
      - '.github/workflows/bundle-starter-audio.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle-audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fetch and verify public-domain starter recording
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/audio
          if [ -f assets/audio/starter-fatiha.ogg ]; then
            echo "Audio already bundled."
            exit 0
          fi
          curl --fail --location --retry 3 --max-time 90 \
            --user-agent "QuranApp/1.0 (CC0 offline recitation)" \
            "https://commons.wikimedia.org/wiki/Special:Redirect/file/001Fatiha.ogg" \
            --output assets/audio/starter-fatiha.ogg
          echo "964ec3ee455b2569188e79374cfdd9b0db2879e9  assets/audio/starter-fatiha.ogg" | sha1sum --check -
      - name: Commit verified offline audio into main
        shell: bash
        run: |
          set -euo pipefail
          git add assets/audio/starter-fatiha.ogg
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Bundle verified CC0 Al-Fatiha audio for offline first launch"
          git push origin HEAD:main
