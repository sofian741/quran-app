name: Verify QVP reader layout in browser
on:
  push:
    branches: [main, feature/qvp-uniform-page-spacing]
    paths:
      - 'mushaf-qvp/**'
      - 'tests/qvp-*'
      - 'tests/fatihah-layout.cjs'
      - 'tests/swipe-performance.cjs'
      - 'tests/quran-features.cjs'
      - 'tests/audio-browser.cjs'
      - 'quran.html'
      - 'style.css'
      - 'audio-player.css'
      - 'sw.js'
      - '.github/workflows/verify-qvp-layout.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare pinned Quran page files
        run: npm run qvp:prepare
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
          echo "QURAN_BROWSER_PATH=$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')" >> "$GITHUB_ENV"
      - name: Verify all 604 QVP pages and geometry alignment
        run: npm run test:qvp
      - name: Verify opening pages, full-screen fit, gestures and Quran features
        run: |
          node tests/fatihah-layout.cjs
          node tests/swipe-performance.cjs
          node tests/quran-features.cjs
      - name: Verify audio highlighting on mobile viewports
        run: |
          node scripts/dev-server.mjs >/tmp/ayat-qvp-audio-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          node tests/audio-browser.cjs
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qvp-reader-layout
          path: artifacts/qvp
          if-no-files-found: ignore
          retention-days: 7
