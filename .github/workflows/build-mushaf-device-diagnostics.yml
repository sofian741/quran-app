name: Build Mushaf Device Diagnostics APK

on:
  workflow_dispatch:
  push:
    branches: [diagnostics/mushaf-device-metrics-20261103]
    paths:
      - .github/workflows/build-mushaf-device-diagnostics.yml
      - quran.html
      - mushaf-device-diagnostic.js

concurrency:
  group: mushaf-diagnostics-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK 36
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install Capacitor dependencies
        run: npm install --no-audit --no-fund

      - name: Check JavaScript syntax and offline audio tests
        run: |
          node --check ayat-connectivity.js
          node --check ayat-reading-continuity.js
          node --check recitations.js
          node --check library.js
          node --check audio-core.js
          node --check audio-downloads.js
          node --check offline-mishary.js
          node --check offline-mishary-sync.js
          node --check native-background-audio.js
          node --check qud-audio.js
          node --check mushaf-keyboard-viewport.js
          node --check library.js
          node --check app-update.js
          node --check android-navigation.js
          node --check scripts/prepare-android-web.mjs
          node --test tests/offline-audio.test.cjs tests/bundled-mishary.test.cjs tests/offline-mishary-sync.test.cjs

      - name: Isolate QA package identity and disable production update endpoint
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('capacitor.config.json')
          config=json.loads(p.read_text(encoding='utf-8'))
          config['appId']='com.sofian.ayat.mushafdiag'
          config['appName']='آيات فحص'
          p.write_text(json.dumps(config,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Embed installed build number and update endpoint
        env:
          QA_BUILD_NUMBER: ${{ github.run_number }}
          UPDATE_MANIFEST_URL: ''
        run: |
          python3 scripts/write-android-build-info.py

      - name: Prepare bundled web app
        run: npm run android:prepare

      - name: Force no update offer in standalone diagnostic app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          Path('www/android-build-info.js').write_text(
            'window.NOOR_ANDROID_BUILD = { versionCode: 0, updateManifestUrl: "" };\n', encoding='utf8')
          PY

      - name: Verify diagnostic build includes unmodified stable reader and measurement script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ('reader-layout-polish.js','reader-enhancements.js','style.css','mushaf-device-diagnostic.js'):
              assert Path('www',name).read_bytes() == Path(name).read_bytes(), name
          assert 'mushaf-device-diagnostic.js' in Path('www/quran.html').read_text(encoding='utf8')
          assert 'mushaf-device-diagnostic.js' not in Path('reader-layout-polish.js').read_text(encoding='utf8')
          print('Reader source untouched. Diagnostics present.')
          PY

      - name: Create Android project
        run: npx cap add android

      - name: Sync web app
        run: npx cap sync android

      - name: Keep Android screen awake while the app is open
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = list(Path('android/app/src/main/java').rglob('MainActivity.java'))
          if len(files) != 1:
              raise SystemExit('Expected one Capacitor MainActivity')
          path = files[0]
          source = path.read_text()
          source = source.replace('public class MainActivity extends BridgeActivity {',
              'public class MainActivity extends BridgeActivity {\n'
              '  @Override public void onCreate(android.os.Bundle state) {\n'
              '    super.onCreate(state);\n'
              '    getWindow().addFlags(android.view.WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);\n'
              '    android.webkit.WebSettings ws = getBridge().getWebView().getSettings();\n'
              '    ws.setMediaPlaybackRequiresUserGesture(false);\n'
              '    ws.setSupportZoom(true);\n'
              '    ws.setBuiltInZoomControls(true);\n'
              '    ws.setDisplayZoomControls(false);\n'
              '    ws.setUseWideViewPort(true);\n'
              '  }')
          path.write_text(source)
          PY

      - name: Lock Android activity to portrait orientation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text(encoding='utf-8')
          match = re.search(r'<activity\b[^>]*android:name="\.MainActivity"[^>]*>', text, re.S)
          if not match:
              raise SystemExit('Capacitor MainActivity not found in Android manifest')
          tag = match.group(0)
          if 'android:screenOrientation=' in tag:
              tag = re.sub(r'android:screenOrientation="[^"]*"', 'android:screenOrientation="portrait"', tag)
          else:
              tag = tag[:-1] + ' android:screenOrientation="portrait">'
          text = text[:match.start()] + tag + text[match.end():]
          manifest.write_text(text, encoding='utf-8')
          assert 'android:screenOrientation="portrait"' in manifest.read_text(encoding='utf-8')
          PY

      - name: Register native audio download support
        run: python3 scripts/register-background-downloads.py

      - name: Align native download plugin package with isolated QA app ID
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          roots = list(Path('android/app/src/main/java').rglob('MainActivity.java'))
          if len(roots) != 1:
              raise SystemExit('Expected one QA MainActivity.java')
          main = roots[0]
          package_match = re.search(r'^package\s+([\w.]+)\s*;', main.read_text(), re.M)
          if not package_match:
              raise SystemExit('MainActivity package declaration missing')
          package_name = package_match.group(1)
          plugin = main.parent / 'QuranBackgroundDownloads.java'
          if not plugin.exists():
              raise SystemExit('Native download plugin missing')
          source = plugin.read_text()
          source, changed = re.subn(r'^package\s+[\w.]+\s*;', 'package ' + package_name + ';', source, count=1, flags=re.M)
          if changed != 1:
              raise SystemExit('Could not rewrite native plugin package')
          plugin.write_text(source)
          assert package_name == 'com.sofian.ayat.mushafdiag', package_name
          print('QA Java package aligned:', package_name)
          PY

      - name: Restore stable QA signing key
        run: |
          base64 -d android-assets/noor-qa-signing.p12.b64 > android-assets/noor-qa-signing.p12
          keytool -list -keystore android-assets/noor-qa-signing.p12 -storetype PKCS12 -storepass android -alias noor-qa >/dev/null

      - name: Set increasing APK version and QA signature
        env:
          QA_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re

          path = Path('android/app/build.gradle')
          source = path.read_text(encoding='utf-8')
          build_number = int(os.environ['QA_BUILD_NUMBER'])
          source, count = re.subn(r'\bversionCode\s+\d+', f'versionCode {build_number}', source, count=1)
          if count != 1:
              raise SystemExit('Could not set Android versionCode')
          source, count = re.subn(r'\bversionName\s+["\'][^"\']+["\']',
              f'versionName "0.1.{build_number}"', source, count=1)
          if count != 1:
              raise SystemExit('Could not set Android versionName')
          signing = """
              signingConfigs {
                  debug {
                      storeFile file('../../android-assets/noor-qa-signing.p12')
                      storePassword 'android'
                      keyAlias 'noor-qa'
                      keyPassword 'android'
                  }
              }
          """
          if 'android {' not in source:
              raise SystemExit('Missing Android Gradle block')
          source = source.replace('android {', 'android {' + signing, 1)
          path.write_text(source, encoding='utf-8')
          print('QA build versionCode:', build_number)
          PY

      - name: Prepare approved Ayat app icon
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          source = Path('android-assets/ayat-icon.jpg')
          if not source.is_file():
              raise SystemExit('Approved Ayat icon is missing')
          with Image.open(source) as image:
              image.convert('RGB').resize((1024, 1024), Image.Resampling.LANCZOS).save(
                  'android-assets/icon.png', optimize=True
              )
          print('Using approved Ayat icon:', source)
          PY

      - name: Generate Android icon and splash
        run: |
          npx @capacitor/assets generate --android \
            --assetPath android-assets \
            --iconBackgroundColor '#015e46' \
            --iconBackgroundColorDark '#015e46' \
            --splashBackgroundColor '#131d19' \
            --splashBackgroundColorDark '#131d19'

      - name: Apply Android app label and vibration permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text(encoding='utf-8')
          permission = '<uses-permission android:name="android.permission.VIBRATE" />'
          if permission not in text:
              text = text.replace('<application', permission + '\n    <application', 1)
              manifest.write_text(text, encoding='utf-8')

          strings = Path('android/app/src/main/res/values/strings.xml')
          text = strings.read_text(encoding='utf-8')
          text = re.sub(r'<string name="app_name">.*?</string>', '<string name="app_name">آيات فحص</string>', text)
          text = re.sub(r'<string name="title_activity_main">.*?</string>', '<string name="title_activity_main">آيات | Ayat</string>', text)
          strings.write_text(text, encoding='utf-8')
          PY

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK artifact
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/Ayat-Mushaf-Diagnostics.apk"
          sha256sum "dist/Ayat-Mushaf-Diagnostics.apk"
          # Shipping 492 MiB of pre-installed recitations here is forbidden.
          python3 - <<'PY'
          from pathlib import Path
          apk = Path('dist/Ayat-Mushaf-Diagnostics.apk')
          size = apk.stat().st_size
          print(f'Isolated Mushaf diagnostic APK: {size / (1024 * 1024):.1f} MiB')
          assert size < 180 * 1024 * 1024, 'Unexpectedly large APK: bundled audio may have leaked'
          PY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ayat-Mushaf-Diagnostics-APK
          path: dist/Ayat-Mushaf-Diagnostics.apk
          if-no-files-found: error
          retention-days: 14
