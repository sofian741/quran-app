name: Prepare Mishary offline audio

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/prepare-mishary-audio.yml
      - scripts/build-synced-mishary.py
      - offline-mishary.js
      - offline-mishary-sync.js
      - tests/bundled-mishary.test.cjs
  workflow_dispatch:

concurrency:
  group: prepare-mishary-offline-audio
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  audio-only:
    name: Prepare 114 surahs without building an APK
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Validate offline library and audio integration
        run: |
          node --check offline-mishary.js
          node --check offline-mishary-sync.js
          node --check library.js
          node --check mushaf-audio.js
          node --test tests/bundled-mishary.test.cjs
          python3 -m py_compile scripts/build-synced-mishary.py
      - name: Install media tools
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Download and validate full Mishary Quran
        run: python3 scripts/build-synced-mishary.py --output dist/mishary
      - name: Package 114 offline surahs and metadata
        run: |
          python3 - <<'PY'
          import json, hashlib
          from pathlib import Path
          base = Path('dist/mishary')
          manifest = json.loads((base / 'manifest.json').read_text(encoding='utf-8'))
          tracks = manifest['tracks']
          if manifest['schemaVersion'] != 2 or manifest['syncLevel'] != 'word':
              raise SystemExit('Missing fully synchronized Mishary word timings')
          if len(tracks) != 114 or {t['surah'] for t in tracks} != set(range(1,115)):
              raise SystemExit('Incomplete Mishary set; cannot publish')
          for entry in tracks:
              path = base / entry['file']
              if not path.is_file() or path.stat().st_size != entry['bytes']:
                  raise SystemExit('Missing/corrupt file: ' + entry['file'])
              if hashlib.sha256(path.read_bytes()).hexdigest() != entry['sha256']:
                  raise SystemExit('Hash mismatch: ' + entry['file'])
              timing = base / entry['timing']
              if not timing.is_file() or hashlib.sha256(timing.read_bytes()).hexdigest() != entry['timingSha256']:
                  raise SystemExit('Missing/corrupt word alignment file: ' + entry['timing'])
              doc = json.loads(timing.read_text(encoding='utf-8'))
              if doc.get('schemaVersion') != 2 or doc.get('surah') != entry['surah']:
                  raise SystemExit('Timing metadata mismatch: ' + entry['timing'])
              if not all(row.get('words') for row in doc.get('verses', [])):
                  raise SystemExit('Incomplete words in ' + entry['timing'])
          total = sum(len(json.loads((base / entry['timing']).read_text())['verses']) for entry in tracks)
          if total != 6236: raise SystemExit(f'Expected 6236 verified ayahs; got {total}')
          print('Validated all 114 chapters, 6236 ayahs, and their genuine word timing segments')
          PY
          cd dist/mishary
          zip -q -0 ../../mishary-synced-v2.zip manifest.json *.mp3 *.json
          cd ../..
          sha256sum mishary-synced-v2.zip
      - name: Publish audio-only asset as prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="assets-mishary-synced-v2"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "Synchronized Mishary audio + word timings (not an APK)" --notes "114 verified EveryAyah Alafasy surahs assembled with matching cpfair/quran-align CC BY 4.0 word-level segments, 6236 verses. Audio source: https://everyayah.com/ . IMPORTANT: verify recording redistribution permission before any public app distribution. This is NOT an Android APK." --prerelease --latest=false
          fi
          gh release upload "$tag" mishary-synced-v2.zip --clobber
      - name: Record verified audio release in the main branch
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          from datetime import datetime, timezone
          manifest = json.loads(Path('dist/mishary/manifest.json').read_text(encoding='utf-8'))
          archive = Path('mishary-synced-v2.zip')
          lines = [
              '# Mishary offline audio: verified asset receipt',
              '',
              'This receipt is written automatically only after all 114 recordings',
              'pass validation and the audio-only GitHub Release upload succeeds.',
              '',
              '- Chapter count: **114/114**',
              '- Synchronized ayah count: **6236/6236**',
              '- Timing source: cpfair/quran-align (CC BY 4.0)',
              '- Original audio: EveryAyah Alafasy_128kbps',
              f"- Transcoded MP3 size: **{sum(t['bytes'] for t in manifest['tracks']) / 1024**2:.1f} MiB**",
              f"- Release archive size: **{archive.stat().st_size / 1024**2:.1f} MiB**",
              f"- Release ZIP SHA256: {hashlib.file_digest(archive.open('rb'), 'sha256').hexdigest()}",
              '- Release tag: assets-mishary-synced-v2',
              '- No Android APK was built by this workflow.',
              f"- Prepared at (UTC): {datetime.now(timezone.utc).isoformat(timespec='seconds')}",
              ''
          ]
          folder = Path('docs')
          folder.mkdir(exist_ok=True)
          (folder / 'MISHARY_AUDIO_READY.md').write_text(chr(10).join(lines), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/MISHARY_AUDIO_READY.md
          if ! git diff --cached --quiet; then
            git commit -m "Record validated 114-surah Mishary offline audio release"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

