name: Bind Adhkar benefit sources
on:
  push:
    paths:
      - '.github/workflows/bind-adhkar-benefit-sources.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bind report cards to each completed dhikr reference
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('adhkar.js'); s=p.read_text()
          old="if(matched)result.push(rule)}return result}"
          new="if(matched)result.push({...rule,source:matched.reference||rule.source})}return result}"
          if old not in s: raise SystemExit('benefitCards marker not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit patch and remove workflow
        run: |
          git config user.name 'quran-app adhkar patcher'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/bind-adhkar-benefit-sources.yml
          git add adhkar.js
          git commit -m 'Bind Adhkar report benefits to corpus references'
          git push
