name: Fix QUD play-button stall

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-qud-playback-stall.yml
      - scripts/fix_qud_stall.py

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch playback preparation
        run: python3 scripts/fix_qud_stall.py

      - name: Validate code and real audio hosts
        run: |
          node --check qud-audio.js
          node --check mushaf-audio.js
          python3 - <<'PY'
          import json, pathlib, urllib.request
          root = pathlib.Path('.')
          manifest = json.loads((root/'data/qud/manifest.json').read_text(encoding='utf-8'))
          assert manifest['reciterCount'] == 20
          checked = []
          for r in manifest['reciters']:
              cat = json.loads((root/r['catalogUrl'].removeprefix('./')).read_text(encoding='utf-8'))
              url = cat['audio']['chapter_urls']['1']
              req = urllib.request.Request(url, headers={
                  'User-Agent': 'Mozilla/5.0 QuranAppAudioCheck/1.0',
                  'Range': 'bytes=0-4095'
              })
              with urllib.request.urlopen(req, timeout=20) as resp:
                  chunk = resp.read(4096)
                  if not chunk:
                      raise RuntimeError(f"empty audio response: {r['name']} {url}")
                  checked.append((r['name'], resp.status, len(chunk)))
          print('Reachable QUD Al-Fatihah audio sources:', len(checked))
          for row in checked:
              print(row)
          qud = (root/'qud-audio.js').read_text(encoding='utf-8')
          mushaf = (root/'mushaf-audio.js').read_text(encoding='utf-8')
          assert 'waitForMetadata' not in qud
          assert 'seekWhenMetadataReady' in qud
          assert "engine.prepare({ autoplay: false })" in mushaf
          PY
          git diff --check

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qud-audio.js mushaf-audio.js CHANGELOG.md
          git commit -m "fix(audio): prevent QUD play button from stalling [skip ci]"
          git push origin HEAD:main
