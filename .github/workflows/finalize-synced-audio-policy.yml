name: Finalize synchronized mushaf audio policy

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-synced-audio-policy.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply final same-reciter policy
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          path = Path('mushaf-audio.js')
          text = path.read_text(encoding='utf-8')

          old_hint = """            ui.repeatHint.textContent = state.provider === 'mp3quran'\n                ? 'تكرار الآية أو نطاق الآيات متاح. عند تطبيقه سننتقل تلقائيًا لتسجيل مشاري العفاسي المتزامن لتحديد الآيات بدقة.'\n                : 'تكرار الآية يعيد الآية الحالية، وتكرار النطاق يعيد الآيات من البداية للنهاية بعدد المرات المحدد.';"""
          new_hint = """            ui.repeatHint.textContent = state.provider === 'mp3quran'\n                ? 'تكرار الآية أو نطاق الآيات يحتاج نسخة متزامنة من القارئ نفسه؛ لن يتم تبديل الشيخ تلقائيًا.'\n                : 'تكرار الآية يعيد الآية الحالية، وتكرار النطاق يعيد الآيات من البداية للنهاية بعدد المرات المحدد.';"""
          text = replace_once(text, old_hint, new_hint, 'repeat state hint')

          marker = """    async function applyRepeat() {"""
          helper = """    function readerIdentity(name) {\n        return core.normalizeArabic(String(name || ''))\n            .replace(/الشيخ|القارئ/g, '')\n            .replace(/[^ء-ي0-9]/g, '');\n    }\n\n    function alignedForCurrentReader(state = engine.state) {\n        if (state.provider === 'quran-foundation') {\n            return alignedReciters.find(reciter => reciter.id === Number(state.reciterId)) || null;\n        }\n        const wanted = readerIdentity(state.reciterName);\n        if (!wanted) return null;\n        return alignedReciters.find(reciter => readerIdentity(reciter.name) === wanted) ||\n            alignedReciters.find(reciter => {\n                const candidate = readerIdentity(reciter.name);\n                return candidate.length >= 8 && wanted.length >= 8 &&\n                    (candidate.includes(wanted) || wanted.includes(candidate));\n            }) || null;\n    }\n\n    async function switchLegacyMp3ToSameAlignedReader({ surah, ayah = 1, autoplay = false } = {}) {\n        if (engine.state.provider !== 'mp3quran') return true;\n        const reciter = alignedForCurrentReader(engine.state);\n        if (!reciter) return false;\n        const ready = await engine.selectAligned(reciter.id, {\n            surah: Number(surah) || engine.state.surah,\n            ayah: Number(ayah) || 1,\n            autoplay\n        });\n        if (ready) lastAlignedId = reciter.id;\n        return ready;\n    }\n\n    async function applyRepeat() {"""
          text = replace_once(text, marker, helper, 'aligned reader helper')

          old_switch = """        const switching = engine.state.provider === 'mp3quran' && (mode === 'verse' || mode === 'range');\n\n        if (switching) {\n            ui.applyRepeatButton.disabled = true;\n            ui.repeatHint.textContent = 'جاري تجهيز التسجيل المتزامن لمشاري العفاسي لتكرار الآيات بدقة…';\n            const changed = await engine.selectAligned(7, {\n                surah: engine.state.surah, ayah: mode === 'range' ? start : 1,\n                autoplay: false\n            });\n            ui.applyRepeatButton.disabled = false;\n            if (!changed) {\n                ui.repeatHint.textContent = 'تعذّر تجهيز تسجيل الآيات. تحقق من الإنترنت وحاول مرة أخرى.';\n                return;\n            }\n        }"""
          new_switch = """        const switching = engine.state.provider === 'mp3quran' && (mode === 'verse' || mode === 'range');\n\n        if (switching) {\n            const sameReader = alignedForCurrentReader(engine.state);\n            if (!sameReader) {\n                ui.repeatHint.textContent = 'القارئ الحالي من مكتبة التلاوات لا يملك نسخة متزامنة داخل المصحف. اختر قارئًا متزامنًا من القائمة؛ لن نغيّر الشيخ تلقائيًا.';\n                return;\n            }\n            ui.applyRepeatButton.disabled = true;\n            ui.repeatHint.textContent = `جاري تجهيز النسخة المتزامنة للقارئ ${sameReader.name} لتكرار الآيات بدقة…`;\n            const changed = await switchLegacyMp3ToSameAlignedReader({\n                surah: engine.state.surah,\n                ayah: mode === 'range' ? start : 1,\n                autoplay: false\n            });\n            ui.applyRepeatButton.disabled = false;\n            if (!changed) {\n                ui.repeatHint.textContent = 'تعذّر تجهيز النسخة المتزامنة للقارئ نفسه. تحقق من الاتصال وحاول مرة أخرى.';\n                return;\n            }\n        }"""
          text = replace_once(text, old_switch, new_switch, 'repeat same-reciter switch')

          old_repeat_change = """    ui.repeatMode.addEventListener('change', () => {\n        repeatClasses(ui.repeatMode.value);\n        ui.repeatHint.textContent = engine.state.provider === 'mp3quran' &&\n            ['verse', 'range'].includes(ui.repeatMode.value)\n            ? 'سيتم استخدام تسجيل مشاري العفاسي المتزامن تلقائيًا حتى يعمل تكرار الآيات بدقة.'\n            : 'تكرار الآية يعيد الآية الحالية، وتكرار النطاق يعيد الآيات من البداية للنهاية بعدد المرات المحدد.';\n    });"""
          new_repeat_change = """    ui.repeatMode.addEventListener('change', () => {\n        repeatClasses(ui.repeatMode.value);\n        if (engine.state.provider === 'mp3quran' && ['verse', 'range'].includes(ui.repeatMode.value)) {\n            const sameReader = alignedForCurrentReader(engine.state);\n            ui.repeatHint.textContent = sameReader\n                ? `سيتم استخدام النسخة المتزامنة لنفس القارئ ${sameReader.name} حتى يعمل التكرار بدقة.`\n                : 'هذا التسجيل غير متزامن داخل المصحف. اختر قارئًا متزامنًا من القائمة؛ لن نغيّر الشيخ تلقائيًا.';\n            return;\n        }\n        ui.repeatHint.textContent = 'تكرار الآية يعيد الآية الحالية، وتكرار النطاق يعيد الآيات من البداية للنهاية بعدد المرات المحدد.';\n    });"""
          text = replace_once(text, old_repeat_change, new_repeat_change, 'repeat mode hint')

          old_listen = """    ui.listenAction.addEventListener('click', async () => {\n        const selected = window.mushafVerseActions?.getSelectedVerse?.();\n        if (!selected) return;\n        window.mushafVerseActions.close();\n\n        // MP3Quran exposes complete surah recordings, not verse timestamps.\n        // Respect the selected reciter: play that reciter's surah from its\n        // beginning rather than silently replacing them with Mishary.\n        const wholeSurah = engine.state.provider === 'mp3quran';\n        listenNotice = '';\n        listenNoticeUntil = 0;\n\n        if (wholeSurah && !engine.state.availableSurahs.includes(selected.surah)) {\n            listenNotice = 'السورة دي مش متاحة بصوت القارئ المختار. اختار سورة متاحة أو قارئ تاني.';\n            listenNoticeUntil = Date.now() + 8000;\n            ui.status.textContent = listenNotice;\n            return;\n        }\n\n        const started = await engine.goTo(\n            selected.surah,\n            wholeSurah ? 1 : selected.ayah,\n            { autoplay: true, ...(wholeSurah ? { position: 0 } : {}) }\n        );\n\n        if (!started) {\n            listenNotice = 'تعذّر بدء التلاوة. تحقق من الاتصال وحاول مجددًا.';\n            listenNoticeUntil = Date.now() + 8000;\n        } else if (wholeSurah) {\n            listenNotice = 'يعمل القارئ المختار من بداية السورة؛ تسجيله لا يوفّر توقيتًا لكل آية.';\n            listenNoticeUntil = Date.now() + 8000;\n        }\n        if (listenNotice) ui.status.textContent = listenNotice;\n    });"""
          new_listen = """    ui.listenAction.addEventListener('click', async () => {\n        const selected = window.mushafVerseActions?.getSelectedVerse?.();\n        if (!selected) return;\n        window.mushafVerseActions.close();\n        listenNotice = '';\n        listenNoticeUntil = 0;\n\n        let started = false;\n        if (engine.state.provider === 'quran-foundation') {\n            started = await engine.goTo(selected.surah, selected.ayah, { autoplay: true });\n        } else {\n            const sameReader = alignedForCurrentReader(engine.state);\n            if (!sameReader) {\n                listenNotice = 'القارئ الحالي من مكتبة التلاوات لا يملك توقيتًا دقيقًا للآيات داخل المصحف. اختر قارئًا متزامنًا من القائمة؛ لن يتم تحويلك إلى شيخ آخر.';\n                listenNoticeUntil = Date.now() + 9000;\n                ui.status.textContent = listenNotice;\n                return;\n            }\n            started = await switchLegacyMp3ToSameAlignedReader({\n                surah: selected.surah,\n                ayah: selected.ayah,\n                autoplay: true\n            });\n        }\n\n        if (!started) {\n            listenNotice = 'تعذّر بدء الآية بصوت القارئ المحدد. تحقق من الاتصال وحاول مجددًا.';\n            listenNoticeUntil = Date.now() + 8000;\n            ui.status.textContent = listenNotice;\n        }\n    });"""
          text = replace_once(text, old_listen, new_listen, 'exact listen handler')

          path.write_text(text, encoding='utf-8')

          ai = Path('AI_CONTEXT.md')
          ai_text = ai.read_text(encoding='utf-8')
          ai_text = ai_text.replace('> آخر تحديث: 2026-10-14\n> نوع التحديث: إصلاح واختبار بصري مخصص لتنسيق سورة الفاتحة على فرع `main`.',
                                    '> آخر تحديث: 2026-10-16\n> نوع التحديث: إنهاء نظام القراء المتزامنين وتثبيت تشغيل الآية بصوت القارئ المحدد على فرع `main`.')
          old_audio = '- مزامنة الآية والكلمة مفعلة لتسجيل مشاري العفاسي ذي المعرّف 7 في Quran Foundation.\n  تسجيلات MP3Quran تعمل طبيعيًا بلا تظليل لأنها ملفات مختلفة لا تملك توقيتات مطابقة.'
          new_audio = '- المصحف يوفّر 20 قارئًا متزامنًا فريدًا: مشاري العفاسي المدمج و19 قارئًا من QUD v3.2.0، وكلهم ببيانات كاملة لـ6236 آية وتوقيت كلمات وروابط 114 سورة متطابقة مع الصوت.\n- الضغط على «الاستماع» يبدأ من الآية المحددة بصوت القارئ المتزامن المختار نفسه. لا يوجد تحويل تلقائي إلى مشاري؛ والحالة القديمة القادمة من MP3Quran لا تتحول إلا إذا وُجدت نسخة متزامنة لنفس الشيخ.'
          if old_audio not in ai_text:
              raise SystemExit('AI_CONTEXT audio block not found')
          ai_text = ai_text.replace(old_audio, new_audio, 1)
          ai_text = ai_text.replace('| `audio-downloads.js` | تنزيل الملفات وفحص المساحة وفهرس الملفات المحفوظة |',
                                    '| `audio-downloads.js` | تنزيل الملفات وفحص المساحة وفهرس الملفات المحفوظة |\n| `qud-audio.js` و`data/qud/` | تشغيل 19 قارئ QUD المتزامنين فوق محرك الصوت نفسه وبيانات التوقيت/المصادر المطابقة |', 1)
          ai.write_text(ai_text, encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          change_text = changelog.read_text(encoding='utf-8')
          marker = '## غير منشور\n\n'
          addition = ('- إضافة 19 قارئًا متزامنًا من QUD v3.2.0 بجانب مشاري العفاسي، ليصبح داخل المصحف 20 قارئًا فريدًا بتوقيت كلمات كامل لكل 6236 آية وروابط صوت مطابقة لـ114 سورة.\n'
                      '- جعل «الاستماع» يبدأ من الآية المحددة بصوت القارئ الحالي نفسه، ومنع التحويل التلقائي إلى مشاري؛ وإذا كانت هناك حالة MP3Quran قديمة فلا تستخدم إلا النسخة المتزامنة لنفس الشيخ عند توفرها.\n'
                      '- إضافة فحص CI شامل لـ118484 سجل آية متزامنًا (19 × 6236) وروابط الصوت ومقاطع الكلمات، مع إبقاء مكتبة MP3Quran الكاملة في صفحة التلاوات المنفصلة.\n\n')
          if addition not in change_text:
              if marker not in change_text:
                  raise SystemExit('CHANGELOG marker missing')
              change_text = change_text.replace(marker, marker + addition, 1)
          changelog.write_text(change_text, encoding='utf-8')
          PY

      - name: Validate final policy
        run: |
          node --check mushaf-audio.js
          node --check qud-audio.js
          python3 - <<'PY'
          import json, pathlib
          root = pathlib.Path('.')
          mushaf = (root / 'mushaf-audio.js').read_text(encoding='utf-8')
          manifest = json.loads((root / 'data/qud/manifest.json').read_text(encoding='utf-8'))
          assert manifest['reciterCount'] == 20
          assert len(manifest['reciters']) == 19
          assert 'engine.selectAligned(7' not in mushaf
          assert 'wholeSurah ? 1 : selected.ayah' not in mushaf
          assert 'engine.goTo(selected.surah, selected.ayah, { autoplay: true })' in mushaf
          assert 'switchLegacyMp3ToSameAlignedReader' in mushaf
          assert 'لن يتم تحويلك إلى شيخ آخر' in mushaf
          print('Final same-reciter exact-verse policy validated for the mushaf.')
          PY
          git diff --check

      - name: Commit final policy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mushaf-audio.js AI_CONTEXT.md CHANGELOG.md
          git commit -m "fix(audio): keep selected reciter for exact verse playback [skip ci]"
          git push origin HEAD:main
