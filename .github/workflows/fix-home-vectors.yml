name: Fix home vector sizing

on:
  push:
    paths:
      - '.github/workflows/fix-home-vectors.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix home SVG sizing and headphone path
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          bad='M3 13h3a2 2 0 0 1 2 2v5H6a3 3 0 0 1 2 2v5H6a3 3 0 0 1-3-3v-4'
          good='M3 13h3a2 2 0 0 1 2 2v5H6a3 3 0 0 1-3-3v-4'
          if bad in s: s=s.replace(bad,good,1)
          p.write_text(s)
          p=Path('home.css'); s=p.read_text()
          marker='/* Stable vector marks for the home dashboard. */'
          if marker not in s:
            s += '''\n\n/* Stable vector marks for the home dashboard. */\n.home-reading-symbol { display:grid; place-items:center; width:36px; height:36px; }\n.home-reading-symbol svg { width:32px; height:32px; }\n.home-feature-arrow { display:grid; place-items:center; width:24px; height:24px; }\n.home-feature-arrow svg { width:18px; height:18px; }\n'''
          p.write_text(s)
          PY
      - name: Commit and remove one-shot workflow
        run: |
          git config user.name 'quran-app ui patcher'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/fix-home-vectors.yml
          git add index.html home.css
          git commit -m 'Finish stable vector icons on home dashboard'
          git push
