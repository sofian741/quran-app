name: Build verified word-synced mushaf reciters

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/sync_qud_audio.py
      - scripts/build_verified_qud.py
      - qud-audio.js
      - mushaf-audio.js
      - .github/workflows/sync-qud-audio.yml

permissions:
  contents: write

concurrency:
  group: build-verified-mushaf-audio-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and fully validate synchronized reciters
        if: github.event_name == 'workflow_dispatch'
        run: python3 scripts/build_verified_qud.py

      - name: Validate generated runtime
        run: |
          node --check qud-audio.js
          node --check mushaf-audio.js
          node --check audio-core.js
          node --check audio-downloads.js
          python3 - <<'PY'
          import gzip, json, pathlib, sys
          from urllib.parse import urlparse

          sys.path.insert(0, 'scripts')
          from sync_qud_audio import VERSE_COUNTS

          root = pathlib.Path('.')
          data = json.loads((root / 'data/qud/manifest.json').read_text(encoding='utf-8'))
          assert data['reciterCount'] == 20, data
          assert data['builtInReciters'] == 1
          assert data['qudReciterCount'] == 19
          assert len(data['reciters']) == 19
          assert len({r['name'] for r in data['reciters']}) == 19
          assert len({r['id'] for r in data['reciters']}) == 19
          expected_refs = {f'{surah}:{ayah}' for surah, count in enumerate(VERSE_COUNTS, 1) for ayah in range(1, count + 1)}

          for reciter in data['reciters']:
              timing = root / reciter['timingUrl'].removeprefix('./')
              catalog = root / reciter['catalogUrl'].removeprefix('./')
              assert timing.is_file() and timing.stat().st_size > 0
              assert catalog.is_file() and catalog.stat().st_size > 0
              with gzip.open(timing, 'rt', encoding='utf-8') as fh:
                  doc = json.load(fh)
              canonical = [row for row in doc['rows'] if row[3] is True]
              assert doc['_meta']['tier'] == 'word'
              assert doc['_meta']['verse_count'] == 6236
              assert len(canonical) == 6236
              assert {row[0] for row in canonical} == expected_refs

              # Mirror the exact runtime acceptance rules. Every verse must be
              # playable and must retain at least one real word segment.
              previous_by_surah = {}
              for row in canonical:
                  ref, start, end, _, _, words = row
                  surah = int(ref.split(':', 1)[0])
                  assert isinstance(start, int) and isinstance(end, int) and 0 <= start < end, (reciter['name'], ref)
                  usable = [word for word in words if isinstance(word, list) and len(word) == 3 and
                            isinstance(word[0], int) and word[0] > 0 and
                            isinstance(word[1], int) and isinstance(word[2], int) and
                            word[1] >= 0 and word[2] > word[1]]
                  assert usable, (reciter['name'], ref, 'no usable word segments')
                  previous = previous_by_surah.get(surah)
                  if previous is not None:
                      assert start >= previous, (reciter['name'], ref, 'verse starts are not monotonic')
                  previous_by_surah[surah] = start

              cat = json.loads(catalog.read_text(encoding='utf-8'))
              urls = cat['audio']['chapter_urls']
              assert len(urls) == 114 and all(str(i) in urls for i in range(1, 115))
              for url in urls.values():
                  parsed = urlparse(url)
                  assert parsed.scheme == 'https' and parsed.netloc
                  assert parsed.hostname not in {'youtube.com', 'www.youtube.com', 'youtu.be', 'drive.google.com', 'docs.google.com'}

          quran = (root / 'quran.html').read_text(encoding='utf-8')
          mushaf = (root / 'mushaf-audio.js').read_text(encoding='utf-8')
          sw = (root / 'sw.js').read_text(encoding='utf-8')
          assert quran.index('audio-downloads.js') < quran.index('data/qud/registry.js') < quran.index('qud-audio.js') < quran.index('mushaf-audio.js')
          assert "if (!window.QudAudioRegistry?.reciters?.length) {" in mushaf
          assert 'engine.selectAligned(7, {' in mushaf, 'MP3Quran verse selection must explicitly switch to Mishary'
          assert 'هذا سلوك مقصود في التطبيق وليس عطلًا' in mushaf, 'explain automatic change to the listener'
          assert 'audio-picker-group-heading' in mushaf, 'keep aligned and MP3Quran readers visually separate'
          assert 'wholeSurah ? 1 : selected.ayah' not in mushaf, 'listen must never fall back to surah start'
          assert 'engine.goTo(selected.surah, selected.ayah, { autoplay: true })' in mushaf
          assert 'switchLegacyMp3ToSameAlignedReader' in mushaf
          assert 'quran-reader-shell-v13' in sw
          print('Validated 20 QUD/Mishary readers, 118484 QUD verse records, and exact same-reciter verse playback policy.')
          PY
          git diff --check

      - name: Commit final generated bundle
        if: github.event_name == 'workflow_dispatch'
        run: |
          rm -rf scripts/__pycache__
          GENERATED_STATUS="$(git status --porcelain -- data/qud quran.html mushaf-audio.js sw.js SOURCES.md)"
          if [ -z "$GENERATED_STATUS" ]; then
            echo "Generated bundle is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/qud quran.html mushaf-audio.js sw.js SOURCES.md
          git commit -m "feat(audio): ship 20 verified word-synced mushaf readers [skip ci]"
          git push origin HEAD:main
