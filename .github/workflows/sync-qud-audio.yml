name: Sync word-synced mushaf reciters

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/sync_qud_audio.py
      - scripts/sync_final_reciters.py
      - qud-audio.js
      - chapter-reciter-extras.js
      - .github/workflows/sync-qud-audio.yml

permissions:
  contents: write

concurrency:
  group: sync-word-audio-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build fully verified reciter bundle
        run: python3 scripts/sync_final_reciters.py

      - name: Validate runtime and generated bundle
        run: |
          node --check qud-audio.js
          node --check chapter-reciter-extras.js
          node --check mushaf-audio.js
          node --check audio-core.js
          node --check audio-downloads.js
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path('data/qud/manifest.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          count = int(data.get('reciterCount', 0))
          assert count >= 21, f'expected >20 synchronized sheikhs, got {count}'
          assert count == 1 + len(data.get('reciters', [])) + len(data.get('qfReciters', []))
          for item in data['reciters']:
              assert pathlib.Path(item['timingUrl'].removeprefix('./')).is_file()
              assert pathlib.Path(item['catalogUrl'].removeprefix('./')).is_file()
          quran = pathlib.Path('quran.html').read_text(encoding='utf-8')
          assert 'data/qud/registry.js' in quran and 'qud-audio.js' in quran and 'chapter-reciter-extras.js' in quran
          print(f"Validated {count} synchronized sheikhs: 1 built-in + {len(data['reciters'])} QUD + {len(data.get('qfReciters', []))} extra QF")
          PY
          git diff --check

      - name: Commit generated bundle
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/qud quran.html mushaf-audio.js sw.js SOURCES.md
          git commit -m "feat(audio): add verified word-synced mushaf reciters [skip ci]"
          git push origin HEAD:main
