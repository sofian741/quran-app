name: Verify app UI

on:
  push:
    paths:
      - 'index.html'
      - 'home.css'
      - 'quran.html'
      - 'adhkar.html'
      - 'adhkar.css'
      - 'adhkar.js'
      - 'recitations.html'
      - 'recitations.css'
      - 'recitations-overrides.css'
      - 'recitations.js'
      - 'floating-recitation.js'
      - 'floating-recitation.css'
      - 'tests/floating-recitation-browser.cjs'
      - 'recitations-library-link.js'
      - 'library.html'
      - 'library.css'
      - 'library.js'
      - 'unified-nav.css'
      - 'sw.js'
      - 'tests/lan-http-assets.cjs'
      - 'tests/ui-pages.cjs'
      - '.github/workflows/verify-app-ui.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'home.css'
      - 'quran.html'
      - 'adhkar.html'
      - 'adhkar.css'
      - 'adhkar.js'
      - 'recitations.html'
      - 'recitations.css'
      - 'recitations-overrides.css'
      - 'recitations.js'
      - 'recitations-library-link.js'
      - 'library.html'
      - 'library.css'
      - 'library.js'
      - 'unified-nav.css'
      - 'sw.js'
      - 'tests/lan-http-assets.cjs'
      - 'tests/ui-pages.cjs'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install browser regression dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq chromium
          npm install --no-save --no-package-lock playwright@1.56.1
      - name: Check JavaScript syntax
        run: |
          node --check adhkar.js
          node --check recitations.js
          node --check floating-recitation.js
          node --check recitations-library-link.js
          node --check library.js
      - name: Verify page contracts and vector UI
        run: node tests/ui-pages.cjs
      - name: Verify Adhkar corpus
        run: node tests/adhkar-data.cjs
      - name: Verify LAN HTTP assets and bounded SVG icons
        env:
          QURAN_BROWSER_PATH: /usr/bin/chromium
        run: node tests/lan-http-assets.cjs

      - name: Verify native floating audio handoff in browser simulation
        env:
          QURAN_BROWSER_PATH: /usr/bin/chromium
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/ayat-floating-server.log 2>&1 &
          sleep 2
          node tests/floating-recitation-browser.cjs
          node tests/recitations-browser.cjs
