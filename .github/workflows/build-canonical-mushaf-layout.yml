name: Build canonical mushaf layout

on:
  push:
    branches:
      - fix/mushaf-uniform-layout-audit
    paths:
      - scripts/build-qpc-line-layout.cjs
      - scripts/apply-uniform-mushaf-renderer.cjs
      - tests/content.cjs
      - .github/workflows/build-canonical-mushaf-layout.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-layout:
    runs-on: ubuntu-latest
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          ref: fix/mushaf-uniform-layout-audit

      - name: Download canonical 15-line page metadata
        run: |
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/hussainsajib/qpc-v4-mushaf-bundle/master/data/page_lines.csv \
            --output /tmp/page_lines.csv
          test "$(head -n 1 /tmp/page_lines.csv)" = "page_number,line_number,line_type,is_centered,first_word_id,last_word_id,surah_number"

      - name: Generate compact local layout
        run: node scripts/build-qpc-line-layout.cjs /tmp/page_lines.csv

      - name: Apply uniform renderer migration
        run: node scripts/apply-uniform-mushaf-renderer.cjs

      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check reader-enhancements.js
          node --check tests/all-pages.cjs

      - name: Validate Quran text and layout
        run: node tests/content.cjs

      - name: Commit generated audit changes
        run: |
          if git diff --quiet -- data/mushaf-layout.json app.js style.css reader-enhancements.js tests/all-pages.cjs; then
            echo "Canonical data and renderer already up to date."
            exit 0
          fi
          git config user.name "quran-layout-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/mushaf-layout.json app.js style.css reader-enhancements.js tests/all-pages.cjs
          git commit -m "refactor(mushaf): canonical 15-line layout with uniform page typography"
          git push origin HEAD:fix/mushaf-uniform-layout-audit
