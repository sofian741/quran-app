name: Import Hisn al-Muslim dataset

on:
  push:
    paths:
      - '.github/workflows/import-hisn.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch licensed Arabic Hisn al-Muslim source
        run: |
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/asellam/HisnElMuslim/main/hisn.json \
            --output /tmp/hisn.json
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/asellam/HisnElMuslim/main/LICENSE.md \
            --output data/adhkar-LICENSE.md

      - name: Convert to app format
        run: |
          node <<'NODE'
          const fs = require('fs');
          const source = JSON.parse(fs.readFileSync('/tmp/hisn.json', 'utf8'));
          let chapterId = 0;
          let itemId = 0;
          const chapters = Object.entries(source).map(([title, chapter]) => ({
            id: ++chapterId,
            title,
            audio: chapter.Audio || null,
            items: (chapter.Adhkar || []).map(item => ({
              id: ++itemId,
              text: item.Text,
              count: Number(item.Count) > 0 ? Number(item.Count) : 1,
              reference: item.Reference || ''
            }))
          }));
          fs.writeFileSync('data/adhkar.json', JSON.stringify(chapters, null, 2) + '\n');
          fs.writeFileSync('data/adhkar-source.json', JSON.stringify({
            title: 'حصن المسلم من أذكار الكتاب والسنة',
            author: 'سعيد بن علي بن وهف القحطاني',
            dataset: 'asellam/HisnElMuslim',
            repository: 'https://github.com/asellam/HisnElMuslim',
            license: 'MIT',
            chapters: chapters.length,
            items: chapters.reduce((sum, chapter) => sum + chapter.items.length, 0)
          }, null, 2) + '\n');
          console.log(`Prepared ${chapters.length} chapters and ${chapters.reduce((s,c)=>s+c.items.length,0)} items`);
          NODE

      - name: Commit imported data
        run: |
          git config user.name 'quran-app data importer'
          git config user.email 'actions@users.noreply.github.com'
          git add data/adhkar.json data/adhkar-source.json data/adhkar-LICENSE.md
          if git diff --cached --quiet; then
            echo 'No data changes.'
            exit 0
          fi
          git commit -m 'Replace adhkar data with licensed referenced Hisn al-Muslim corpus'
          git push
